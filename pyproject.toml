[build-system]
build-backend = "hatchling.build"
requires = [
    "hatch-vcs",
    "hatchling",
]

[project]
dependencies = [
    "duckdb",
]
description = "The power of duckdb with the ease of pandas"
dynamic = [
    "version",
]
name = "lazy_pandas"
readme = "README.md"
requires-python = ">=3.10"

[tool.codespell]
skip = ".git,.tox,./venv,./docs/site,./tests/assets/*"

[tool.coverage.report]
exclude_lines = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "pass",
    "pragma: no cover",
    "raise NotImplementedError",
]

[tool.coverage.run]
omit = [
    "*/conftest.py",
    "*/tests/*",
]
source = [
    "lazy_pandas",
]

[tool.hatch.build]
exclude = [
    "/tests",
]

[tool.hatch.envs.hatch-test]
dependencies = [
    "pandas",
    "pyarrow",
    "pyiceberg[sql-sqlite]",
    "pytest >=8.3.3,<9",
    "pytest-cov >=4.1.0,<5",
]
extra-args = [
    "-vv",
]

[tool.hatch.envs.hatch-test.scripts]
run = "pytest{env:HATCH_TEST_ARGS:} {args}"

[tool.hatch.version]
path = "src/lazy_pandas/__init__.py"

[tool.pytest.ini_options]
addopts = "--cov=lazy_pandas --cov-report=term --cov-report=html"
pythonpath = "src"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-unsafe-fixes = [
    "UP",
]
